<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umbra VTT</title><link rel="stylesheet" href="styles.css?v=20260818-4"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="auth" class="auth"><div class="card login"><h1>UMBRA</h1><p>Virtual Tabletop</p><input id="username" autocomplete="username" maxlength="24" placeholder="Usuário"><input id="password" type="password" autocomplete="current-password" maxlength="72" placeholder="Senha"><input id="confirmPassword" class="signup-only hidden" type="password" autocomplete="new-password" maxlength="72" placeholder="Confirmar senha"><div class="row"><button id="loginBtn">Entrar</button><button id="signupBtn" class="ghost">Criar conta</button></div><small id="authMsg"></small><small class="muted">A Umbra usa apenas usuário e senha. Não é necessário e-mail.</small></div></div>
<div id="app" class="hidden"><header><b>UMBRA</b><nav><button data-page="home">Menu</button><button data-page="campaigns">Campanhas</button><button data-page="sheets">Fichas</button></nav><div class="row"><span id="who"></span><button id="logoutBtn" class="ghost">Sair</button></div></header><main><section id="home" class="page"><div class="hero"><h1>Sua mesa, em tempo real.</h1><p>Campanhas, mapas, tokens, iniciativa, dados e fichas vinculadas.</p></div></section><section id="campaigns" class="page hidden"><div class="title"><div><h2>Campanhas</h2><p>Suas mesas e convites.</p></div><button id="newCampaign">+ Criar campanha</button></div><div class="join"><input id="inviteCode" placeholder="Código de convite"><select id="joinRole"><option value="player">Jogador</option><option value="spectator">Espectador</option></select><button id="joinBtn">Pedir para entrar</button></div><div id="campaignList" class="cards"></div></section><section id="sheets" class="page hidden"><div class="title"><div><h2>Fichas</h2></div><button id="linkSheet">+ Vincular ficha</button><div id="sheetList" class="cards"></div></section>
<section id="tabletop" class="page hidden tabletopPage"><div id="viewport"><div id="world"><img id="map" alt=""><div id="fogLayer"></div><div id="tokenLayer"></div><div id="cursorLayer"></div><div id="selectionBox"></div></div></div><div class="vttTopLeft glassbar"><button id="backCampaigns" class="iconBtn">←</button><div class="campaignIdentity"><img id="campaignTopCover" class="campaignTopCover hidden" alt=""><div><b id="campaignName"></b><small id="campaignSubtitle"></small></div></div><span id="roleBadge" class="roleBadge"></span></div><div class="vttTopRight glassbar master-only"><button id="inviteBtn" class="ghost">🔗 Convite</button><button id="campaignSettingsBtn" class="ghost">⚙</button><button id="toggleSession">Abrir sessão</button></div><aside id="toolRail" class="toolRail glassbar"><button data-tool="select" class="active" title="Selecionar, mover objetos e navegar pela mesa">↖</button><button data-tool="fog" class="permission-fog" title="Fog: esquerdo cria, direito apaga">◩</button></aside><div class="zoomControls glassbar"><button id="zoomOut">−</button><span id="zoomLabel">65%</span><button id="zoomIn">+</button><button id="centerView">⌾</button></div>
<section id="sideHub" class="sideHub glassPanel"><nav class="hubTabs"><button data-hub="players" class="active">Players</button><button data-hub="initiative">Iniciativa</button><button data-hub="dice">Dados</button><button data-hub="time">Horário</button></nav><div id="hubPlayers" class="hubPane"><div class="paneHead"><b>Players</b><small id="presenceCount">0 online</small></div><div id="members"></div><div id="requests" class="master-only"></div></div><div id="hubInitiative" class="hubPane hidden"><button id="addInitiative">＋</button><div id="initiative"></div></div><div id="hubDice" class="hubPane hidden"><div id="diceTray" class="diceTray"><button data-die="4">d4</button><button data-die="6">d6</button><button data-die="8">d8</button><button data-die="10">d10</button><button data-die="12">d12</button><button data-die="16">d16</button><button data-die="20">d20</button><button data-die="100">d100</button></div><div class="customDie"><span>1d</span><input id="customSides" type="number" min="2" max="10000" value="30"><button id="addCustomDie">Adicionar</button></div><div id="dicePool"></div><button id="clearDice">Limpar</button><button id="rollDice">Rolar dados</button><div id="diceResult" class="hidden"></div><div id="diceHistory"></div></div><div id="hubTime" class="hubPane hidden"><strong id="rpgTimeDisplay">—</strong><input id="rpgTime" type="datetime-local"><button id="saveRpgTime">Salvar horário</button></div></section>
<section id="libraryDock" class="libraryDock glassPanel"><div class="libraryTabs"><button data-library="token" class="active">Tokens</button><button data-library="map">Mapas</button></div><div id="assets" class="assetStrip"></div><div class="libraryAdd"><button id="openAssetMenu">＋ Adicionar</button><div id="assetMenu" class="assetMenu hidden"><button id="uploadTokenImage"><b>Token</b></button><button id="uploadMapImage"><b>Mapa</b></button></div><input id="assetFile" type="file" accept="image/*" hidden></div></section></section></main></div>
<div id="permissionsModal" class="modal hidden"><div class="modalBackdrop" data-close-permissions></div><div class="modalCard"><h2 id="permissionPlayerName">Permissões</h2><select id="permissionRole"><option value="player">Jogador</option><option value="spectator">Espectador</option></select><div class="permissionGrid"><label><input type="checkbox" data-perm="move_own_tokens">Mover próprios tokens</label><label><input type="checkbox" data-perm="move_any_token">Mover qualquer token</label><label><input type="checkbox" data-perm="create_tokens">Criar tokens</label><label><input type="checkbox" data-perm="draw">Desenhar</label><label><input type="checkbox" data-perm="fog">Controlar fog</label><label><input type="checkbox" data-perm="manage_initiative">Iniciativa</label><label><input type="checkbox" data-perm="manage_time">Horário</label><label><input type="checkbox" data-perm="upload_assets">Assets</label></div><button id="savePermissions">Salvar</button><button id="closePermissions" class="ghost">Fechar</button></div></div>
<div id="campaignSettingsModal" class="modal hidden"><div class="modalBackdrop" data-close-settings></div><div class="modalCard"><button id="closeCampaignSettings" class="ghost">✕</button><h2>Configurações</h2><div id="campaignCoverPreview" class="settingsCoverPreview"></div><button id="chooseCampaignCover">Imagem</button><button id="removeCampaignCover">Remover</button><input id="campaignCoverFile" type="file" accept="image/*" hidden><label class="field">Nome<input id="campaignSettingsName"></label><label class="field">Descrição<textarea id="campaignSettingsDescription"></textarea></label><b id="campaignSettingsRole"></b><b id="campaignSettingsId"></b><button id="saveCampaignSettings">Salvar</button><button id="deleteCampaignBtn" class="dangerButton">Excluir campanha</button></div></div>
<script src="umbra-ui.js?v=20260818-4"></script><script src="app.js?v=20260818-4"></script><script src="owlbear-layer.js?v=20260818-4"></script><script src="psyque-integration.js?v=20260815-1"></script></body></html>
